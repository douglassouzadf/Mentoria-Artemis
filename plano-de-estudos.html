<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plano de Estudos · Mentoria Ártemis</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Archivo:wght@400;600&family=Archivo+Narrow:wght@600&display=swap">
<style>
/* Página de passagem: existe só para a Cloudflare contar cada clique em "Quero meu plano de estudos".
   Cada visita a /plano-de-estudos = uma pessoa que clicou para abrir o formulário. */
:root {
  --preto:#0b0a08; --linha:#2b261c; --dourado:#d4af37; --dourado-claro:#ecd27a;
  --texto:#efe9dc; --texto-suave:#a59d8b;
  --f-titulo:"Cinzel", Georgia, serif;
  --f-texto:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-rotulo:"Archivo Narrow", "Arial Narrow", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--preto); color: var(--texto); font-family: var(--f-texto);
  display: grid; place-items: center; text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { display: grid; gap: 1.1rem; justify-items: center; max-width: 30rem; padding-block: 2rem; }
.alvo { width: 72px; height: 72px; border-radius: 50%; border: 2px solid var(--dourado); display: grid; place-items: center; animation: girar 2.4s linear infinite; }
.alvo::after { content: ""; width: 24px; height: 24px; border-radius: 50%; background: var(--dourado); box-shadow: 0 0 0 8px var(--preto), 0 0 0 9.5px var(--dourado); }
@keyframes girar { 50% { transform: scale(.92); } }
h1 { font-family: var(--f-titulo); font-size: 1.6rem; margin: 0; color: var(--dourado-claro); }
p { margin: 0; color: var(--texto-suave); line-height: 1.6; }
a.botao { font-family: var(--f-rotulo); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: .88rem; text-decoration: none; padding: .95rem 1.4rem; border-radius: 2px; background: var(--dourado); color: var(--preto); }
a.voltar { color: var(--texto-suave); font-size: .9rem; }
:focus-visible { outline: 2px solid var(--dourado); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .alvo { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="alvo" aria-hidden="true"></div>
  <h1>Vamos montar o seu plano!</h1>
  <p>O formulário do <b>Plano de Estudos Ártemis</b> vai abrir em instantes. Tenha o seu edital em mãos.</p>
  <a class="botao" id="abrir" href="#">Não abriu? Clique aqui</a>
  <a class="voltar" href="index.html">← Voltar ao site</a>
</main>
<script>
  // Link do participante do Formulário Google (o "Plano de Estudos Ártemis · Solicitação").
  // É o ÚNICO lugar do site onde esse link aparece.
  const LINK_FORMULARIO = 'https://docs.google.com/forms/d/e/1FAIpQLSct9XjSvJoOj3vfC0PxprwcSnGnqHLUo2kfKGlfaRKfHpxGQw/viewform';

  // O botão "Não abriu?" usa o mesmo link
  document.getElementById('abrir').href = LINK_FORMULARIO;

  // Se o link ainda não foi colado, avisa em vez de abrir uma página quebrada
  if (!LINK_FORMULARIO.startsWith('https://')) {
    document.querySelector('h1').textContent = 'Formulário em preparação';
    document.querySelector('p').textContent = 'Fale com a gente pelo WhatsApp que enviamos o formulário para você.';
    document.getElementById('abrir').remove();
  } else {
    // Espera um pouco para a Cloudflare registrar a visita e então abre o formulário
    setTimeout(() => { location.href = LINK_FORMULARIO; }, 1200);
  }
</script>
</body>
</html>
